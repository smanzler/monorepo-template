name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Vercel's CLI reads repo metadata to tag the deployment; stripping it
      # keeps the build from picking up commit/branch info that can be stale
      # or wrong on Actions runners.
      - name: Strip Git metadata for Vercel
        run: rm -rf .git

      - run: pnpm add -g vercel

      # Deploy from the repo root: the project's Root Directory is apps/web,
      # and Vercel applies it to the uploaded source. The root also carries the
      # pnpm workspace that @template/shared resolves through.
      - name: Deploy
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
